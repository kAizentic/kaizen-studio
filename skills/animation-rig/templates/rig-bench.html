<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Animation Rig · bench</title>
<style>
  :root{--bg:#0e0f13;--panel:#16181f;--panel-2:#1c1f28;--line:#282c38;--ink:#e8eaf0;--ink-dim:#9aa0b0;
    --ink-faint:#5f6678;--accent:#6ea8ff;--accent-2:#b98bff;--good:#5fd39a;--warn:#ffb454;--track-h:32px;}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:13px/1.4 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    display:grid;grid-template-rows:auto 1fr auto;height:100vh;overflow:hidden;}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);}
  header h1{font-size:14px;margin:0;font-weight:650}header h1 span{color:var(--ink-faint);font-weight:400}
  .spacer{flex:1}.ctrl{display:flex;align-items:center;gap:6px}
  button{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;font:inherit;font-size:12px;}
  button:hover{border-color:#3a4051;background:#222634}button.primary{background:var(--accent);color:#0b1220;border-color:transparent;font-weight:600}
  button.ghost{background:transparent}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent;padding:6px 12px}.seg button.on{background:var(--accent);color:#0b1220;font-weight:600}
  select,input[type=number]{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;font-size:12px;}
  input[type=number]{width:58px}input[type=range]{accent-color:var(--accent);width:104px}
  label.mini{font-size:11px;color:var(--ink-dim)}.muted{color:var(--ink-faint)}
  main{display:grid;overflow:hidden}
  .stagewrap{position:relative;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,#191c26 0%,#0e0f13 70%);display:grid;place-items:center;}
  .stage{position:relative;width:min(760px,82%);aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px -40px #000;background:#0b0c11;}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .demo{position:absolute;left:50%;width:120px;height:120px;margin-left:-60px;border-radius:14px;display:grid;place-items:center;color:#0b1220;font-weight:600}
  #d0{top:40px;background:var(--accent)}#d1{top:70px;background:var(--accent-2)}#d2{top:100px;background:var(--good)}
  .stagehint{position:absolute;bottom:8px;left:12px;color:#fff;opacity:.4;font-size:11px;z-index:10;mix-blend-mode:difference}
  footer{border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .knobs{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:var(--panel-2)}
  .knobs .grp{display:flex;align-items:center;gap:7px}.knobs .val{font-variant-numeric:tabular-nums;color:var(--accent);font-size:11px;min-width:30px;text-align:right}
  .knobs .sep{width:1px;align-self:stretch;background:var(--line)}.knobs .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
  .knobs label.mini{cursor:help;text-decoration:underline dotted #4a5163;text-underline-offset:3px}.knobs label.mini:hover{color:var(--ink)}
  #validity{font-size:10px;letter-spacing:.02em}
  .tbar{display:flex;align-items:center;gap:12px;padding:7px 14px;border-bottom:1px solid var(--line)}
  .tbar .read{font-variant-numeric:tabular-nums;color:var(--ink-dim)}.tbar .read b{color:var(--ink)}
  .timeline{display:grid;grid-template-columns:160px 1fr;max-height:26vh;overflow:auto}
  .col-labels{border-right:1px solid var(--line)}
  .lbl-head{height:26px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--ink-faint);background:var(--panel);position:sticky;top:0;z-index:3}
  .ruler{position:relative;height:26px;border-bottom:1px solid var(--line);background:var(--panel);cursor:pointer;user-select:none;position:sticky;top:0;z-index:3}
  .ruler .tick{position:absolute;top:0;bottom:0;border-left:1px solid #23262f}.ruler .tick span{position:absolute;top:5px;left:4px;font-size:10px;color:var(--ink-faint)}
  .rowlbl{height:var(--track-h);border-bottom:1px solid #1f2230;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px}
  .rowlbl .sw{width:9px;height:9px;border-radius:3px;flex:0 0 auto}.rowlbl .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowlbl .prop{color:var(--ink-faint);font-size:10px}.rowlbl .x{color:var(--ink-faint);cursor:pointer;padding:0 3px}.rowlbl .x:hover{color:var(--warn)}
  .lanes{position:relative}.lane{position:relative;height:var(--track-h);border-bottom:1px solid #1f2230}
  .clip{position:absolute;top:6px;height:calc(var(--track-h) - 12px);border-radius:6px;background:linear-gradient(180deg,#33415f,#28324a);border:1px solid #40506e;cursor:grab;display:flex;align-items:center;overflow:hidden}
  .clip .fill{position:absolute;inset:0;background:linear-gradient(90deg,#3b6fd422,#6ea8ff33)}
  .clip .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}.clip .h.l{left:0}.clip .h.r{right:0}
  .clip .cap{position:relative;padding:0 8px;font-size:10px;color:#cfe0ff;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--good);z-index:4;pointer-events:none;box-shadow:0 0 8px #5fd39a99}
  #playhead::before{content:"";position:absolute;top:-1px;left:-4px;border:5px solid transparent;border-top-color:var(--good);border-bottom:0}
  .insp{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:7px 14px;border-top:1px solid var(--line);background:var(--panel)}
  .insp .grp{display:flex;align-items:center;gap:6px}.insp .sep{width:1px;align-self:stretch;background:var(--line)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#12351f;color:#9ff0c4;border:1px solid #2f6b48;border-radius:9px;padding:9px 15px;font-size:12px;z-index:60;opacity:0;transition:opacity .22s;pointer-events:none;max-width:70vw;text-align:center}
  /* ⛶ maximize the preview — header + knobs + clock stay floating so you can still tune; Esc exits */
  .previewmax{overflow:hidden}
  .previewmax header{position:fixed;top:0;left:0;right:0;z-index:9992;background:rgba(15,17,22,.92);backdrop-filter:blur(6px)}
  .previewmax .stagewrap{position:fixed;inset:0;z-index:9990;margin:0;padding:0;border:0;border-radius:0;background:#000}
  .previewmax .stage{width:100%;height:100%;max-width:none;aspect-ratio:auto;border-radius:0;border:0;box-shadow:none}
  .previewmax footer{position:fixed;left:0;right:0;bottom:0;z-index:9992;background:rgba(15,17,22,.92);backdrop-filter:blur(6px)}
  .previewmax .timeline,.previewmax .insp{display:none}
</style>
</head>
<body>
  <header>
    <h1>Animation Rig <span id="targetname">· bench</span></h1>
    <div class="ctrl"><span class="mini muted">Axis</span>
      <div class="seg" id="axis"><button data-axis="time" class="on">⏱ Time</button><button data-axis="scroll">⇕ Scroll</button></div></div>
    <div class="ctrl" id="time-ctrls"><button id="play" class="primary">▶ Play</button>
      <label class="mini muted">loop <input type="checkbox" id="loop" checked></label>
      <label class="mini muted">dur <input type="number" id="dur" value="4" min="0.4" step="0.1"> s</label></div>
    <div class="spacer"></div>
    <div class="ctrl"><button id="maxprev" title="Maximize preview — Esc to exit">⛶ Preview</button><button id="add">＋ Content track</button><button id="export">⤓ Export</button>
      <button id="apply" class="primary" title="Write the current tune to the code as call-site props. Needs serve.py running.">✓ Apply</button>
      <button id="reset" class="ghost">Reset</button><button id="shutdown" class="ghost" title="Stop the write-back server and close the tool">Quit</button></div>
  </header>
  <div id="toast"></div>
  <main><div class="stagewrap"><div class="stage" id="stage">
    <div class="demo" id="d0">A</div><div class="demo" id="d1">B</div><div class="demo" id="d2">C</div>
    <div class="stagehint" id="hint">t = 0.00</div>
  </div></div></main>
  <div id="scrollproxy" style="position:fixed;right:14px;top:110px;width:26px;height:220px;z-index:20;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:auto;display:none">
    <div style="position:sticky;top:0;writing-mode:vertical-rl;font-size:9px;color:var(--ink-faint);padding:6px 0;text-align:center">scroll ↑↓</div><div style="height:900px;width:1px"></div></div>
  <footer>
    <div class="knobs" id="knobs"><span class="tag">knobs</span></div>
    <div class="tbar"><div class="read">clock <b id="clk">0.000</b></div>
      <button id="scrub0" class="ghost">⤒ 0</button><button id="scrubm" class="ghost">◐ .5</button><button id="scrub1" class="ghost">⤓ 1</button>
      <div class="spacer"></div><div class="read muted" id="selname">— no track selected —</div></div>
    <div class="timeline"><div class="col-labels"><div class="lbl-head">CONTENT TRACKS</div><div id="rowlabels"></div></div>
      <div><div class="ruler" id="ruler"></div><div class="lanes" id="lanes"><div id="playhead" style="left:0"></div></div></div></div>
    <div class="insp" id="insp"><span class="muted">Optional: add content tracks to give separate elements independent timing.</span></div>
  </footer>

<script>
/* =======================================================================
   RIG CONFIG — GENERATED PER TARGET. Replace this block when rigging a real
   animation (see references/binding-model.md). Ships with a minimal demo so
   the template runs standalone.
   ======================================================================= */
const RIG = {
  target: "demo",
  knobs: [
    { key:"stagger", label:"stagger", min:0, max:0.5, step:0.01, def:0.12, tip:"Gap between each element's entrance (clock units)." },
    { key:"travel",  label:"travel",  min:0, max:200, step:1,    def:80,   tip:"Entrance distance in px." },
    { key:"rotate",  label:"rotate",  min:0, max:360, step:5,    def:0,    tip:"Entrance rotation in deg." },
  ],
  content: [],  // e.g. [{id:"d0",label:"Box A"}] to give elements independent tracks
  preview: {
    mode:"inline",
    build(){},                                   // (re)create elements when a rebuild knob changes
    render({ knobs, clock }){                     // drive #stage from knobs + clock
      ["d0","d1","d2"].forEach((id,i)=>{
        const el=document.getElementById(id); if(!el)return;
        let p=Math.min(1,Math.max(0,(clock - i*knobs.stagger)/0.5));
        p=1-Math.pow(1-p,3);
        el.style.opacity=p;
        el.style.transform=`translateY(${(1-p)*knobs.travel}px) rotate(${(1-p)*knobs.rotate}deg)`;
      });
    },
    // validity(state){ return {ok:true,msg:""}; }  // optional live constraint badge
  },
  apply: { endpoint:"/apply" },
};
/* ===================== END RIG CONFIG ===================== */

//////////////////// ENGINE (generalized — do not edit per target) ////////////////////
const EASE={linear:t=>t,easeIn:t=>t*t,easeOut:t=>1-(1-t)*(1-t),easeInOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  cubicOut:t=>1-Math.pow(1-t,3),cubicInOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  backOut:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},expoOut:t=>t===1?1:1-Math.pow(2,-10*t)};
const EASE_KEYS=Object.keys(EASE);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const $=s=>document.querySelector(s);
const fmt=v=>{v=+v;return (Math.abs(v)<1&&v!==0)?v.toFixed(2).replace(/^(-?)0/,'$1'):String(v%1?+v.toFixed(2):v);};

// knob state
const knob={}; RIG.knobs.forEach(k=>knob[k.key]=k.def);
$('#targetname').textContent='· '+RIG.target;

// build knob DOM
(function buildKnobs(){
  const box=$('#knobs');
  RIG.knobs.forEach((k,i)=>{
    if(i>0){const s=document.createElement('div');s.className='sep';box.appendChild(s);}
    const g=document.createElement('div');g.className='grp';
    // knob kinds: default numeric range, plus type:"color" and type:"text" (values kept as strings)
    const lab=`<label class="mini muted" title="${(k.tip||'').replace(/"/g,'&quot;')}">${k.label}</label>`;
    if(k.type==='color'){
      g.innerHTML=lab+`<input type="color" id="k-${k.key}" value="${k.def}" style="width:32px;height:22px;padding:0;border:1px solid #2a3340;background:none;cursor:pointer;border-radius:4px">`+
        `<span class="val" id="v-${k.key}">${k.def}</span>`;
    } else if(k.type==='text'){
      g.innerHTML=lab+`<input type="text" id="k-${k.key}" value="${k.def}" style="width:${(k.size||8)*9}px;background:#111820;color:#cfe3f7;border:1px solid #2a3340;border-radius:4px;padding:2px 6px;font:inherit">`+
        `<span class="val" id="v-${k.key}"></span>`;
    } else {
      g.innerHTML=lab+
        `<input type="range" id="k-${k.key}" min="${k.min}" max="${k.max}" step="${k.step}" value="${k.def}">`+
        `<span class="val" id="v-${k.key}">${fmt(k.def)}</span>`;
    }
    box.appendChild(g);
    g.querySelector('input').oninput=e=>{
      knob[k.key]=(k.type==='color'||k.type==='text')?e.target.value:parseFloat(e.target.value);
      $('#v-'+k.key).textContent=(k.type==='text')?'':(k.type==='color'?knob[k.key]:fmt(knob[k.key]));
      if(k.rebuild&&RIG.preview.build)RIG.preview.build(); runValidity(); applyClock(clock); persist(); };
  });
  const v=document.createElement('div');v.className='grp';v.innerHTML='<span id="validity"></span>';box.appendChild(v);
})();
function setKnobDom(){ RIG.knobs.forEach(k=>{ $('#k-'+k.key).value=knob[k.key];
  $('#v-'+k.key).textContent=(k.type==='text')?'':(k.type==='color'?knob[k.key]:fmt(knob[k.key])); }); }
function runValidity(){
  const el=$('#validity'); let bad=null;
  for(const k of RIG.knobs){ if(k.validity){ const r=k.validity({knobs:knob,stage:$('#stage')}); if(r&&!r.ok){bad=r.msg;break;} } }
  if(RIG.preview.validity&&!bad){ const r=RIG.preview.validity({knobs:knob,stage:$('#stage')}); if(r&&!r.ok)bad=r.msg; }
  if(bad){ el.textContent='⚠ '+bad; el.style.color='#ff8f6b'; } else { el.textContent=''; }
}

//////////////////// CONTENT TRACKS ////////////////////
const CONTENT=RIG.content||[];
const CPROPS={opacity:{def:1},x:{def:0},y:{def:0},scale:{def:1},rotate:{def:0}};
const CPROP_KEYS=Object.keys(CPROPS);
let idc=1; const nid=()=>'t'+(idc++);
const COLORS=['#6ea8ff','#b98bff','#5fd39a','#ffb454','#ff7a9c'];
function mkTrack(o){return Object.assign({id:nid(),target:(CONTENT[0]?.id)||'',property:'opacity',from:0,to:1,start:0.3,end:0.6,easing:'easeOut',color:COLORS[(idc)%COLORS.length]},o);}
let tracks=[]; let selected=null;
function evalTrack(tr,t){const span=Math.max(1e-6,tr.end-tr.start);const local=clamp((t-tr.start)/span);return tr.from+(tr.to-tr.from)*(EASE[tr.easing]||EASE.linear)(local);}
function applyContent(t){
  if(!CONTENT.length)return;
  const st={}; CONTENT.forEach(e=>{st[e.id]={};CPROP_KEYS.forEach(p=>st[e.id][p]=CPROPS[p].def);});
  tracks.forEach(tr=>{ if(st[tr.target]) st[tr.target][tr.property]=evalTrack(tr,t); });
  CONTENT.forEach(e=>{const s=st[e.id],n=document.getElementById(e.id);if(!n)return;
    n.style.opacity=s.opacity;n.style.transform=`translate(${s.x}px,${s.y}px) rotate(${s.rotate}deg) scale(${s.scale})`;});
}

//////////////////// CLOCK ////////////////////
let clock=0,axis='time',playing=false,rafId=null,t0=0,startClock=0;
function applyClock(t){
  if(RIG.preview.mode==='iframe'){ const f=$('#stage iframe'); f&&f.contentWindow&&f.contentWindow.postMessage({knobs:knob,clock:t},'*'); }
  else RIG.preview.render({knobs:knob,clock:t});
  applyContent(t);
  const h=$('#hint'); if(h)h.textContent='t = '+t.toFixed(2);   // #hint absent in iframe mode — guard it
  $('#clk').textContent=t.toFixed(3); $('#playhead').style.left=(t*100)+'%';
}
function setClock(t){clock=clamp(t);applyClock(clock);}
function tick(now){if(!playing)return;const dur=parseFloat($('#dur').value)||4;let t=startClock+(now-t0)/1000/dur;
  if(t>=1){if($('#loop').checked){t=t%1;t0=now;startClock=0;}else{t=1;playing=false;$('#play').textContent='▶ Play';}}setClock(t);if(playing)rafId=requestAnimationFrame(tick);}
function play(){if(clock>=1)startClock=0;else startClock=clock;t0=performance.now();playing=true;$('#play').textContent='⏸ Pause';rafId=requestAnimationFrame(tick);}
function pause(){playing=false;cancelAnimationFrame(rafId);$('#play').textContent='▶ Play';}
const proxy=$('#scrollproxy');
function onProxyScroll(){const max=proxy.scrollHeight-proxy.clientHeight;setClock(max>0?proxy.scrollTop/max:0);}
function setAxis(a){axis=a;document.querySelectorAll('#axis button').forEach(b=>b.classList.toggle('on',b.dataset.axis===a));
  $('#time-ctrls').style.opacity=a==='time'?'1':'.4';$('#time-ctrls').style.pointerEvents=a==='time'?'auto':'none';
  proxy.style.display=a==='scroll'?'block':'none';if(a==='scroll'){pause();proxy.scrollTop=clock*(proxy.scrollHeight-proxy.clientHeight);}}

//////////////////// TIMELINE ////////////////////
const lanes=$('#lanes'),rowlabels=$('#rowlabels'),ruler=$('#ruler');
(function buildRuler(){for(let i=0;i<=10;i++){const d=document.createElement('div');d.className='tick';d.style.left=(i*10)+'%';if(i<10){const s=document.createElement('span');s.textContent=(i/10).toFixed(1);d.appendChild(s);}ruler.appendChild(d);}})();
function renderTimeline(){
  rowlabels.innerHTML=''; [...lanes.querySelectorAll('.lane')].forEach(n=>n.remove());
  tracks.forEach(tr=>{
    const el=CONTENT.find(e=>e.id===tr.target);
    const rl=document.createElement('div');rl.className='rowlbl';
    rl.innerHTML=`<span class="sw" style="background:${tr.color}"></span><span class="nm">${el?el.label:tr.target} <span class="prop">· ${tr.property}</span></span><span class="x" title="delete">✕</span>`;
    rl.onclick=e=>{if(e.target.classList.contains('x')){delTrack(tr.id);return;}select(tr.id);};rowlabels.appendChild(rl);
    const lane=document.createElement('div');lane.className='lane';
    const clip=document.createElement('div');clip.className='clip';clip.style.left=(tr.start*100)+'%';clip.style.width=((tr.end-tr.start)*100)+'%';clip.style.borderColor=tr.color;
    clip.innerHTML=`<div class="fill"></div><div class="h l"></div><span class="cap">${tr.property} · ${tr.easing}</span><div class="h r"></div>`;
    if(selected===tr.id)clip.style.outline='2px solid '+tr.color;
    attachDrag(clip,tr,lane);clip.addEventListener('mousedown',()=>select(tr.id));lane.appendChild(clip);lanes.appendChild(lane);
  });
}
function attachDrag(clip,tr,lane){const laneW=()=>lane.getBoundingClientRect().width;
  function drag(e,mode){e.preventDefault();const x0=e.clientX,s0=tr.start,e0=tr.end,w=laneW();
    function mv(ev){const d=(ev.clientX-x0)/w;if(mode==='move'){const len=e0-s0,ns=clamp(s0+d,0,1-len);tr.start=ns;tr.end=ns+len;}
      else if(mode==='l')tr.start=Math.min(tr.end-0.01,Math.max(0,s0+d));else tr.end=Math.max(tr.start+0.01,Math.min(1,e0+d));
      clip.style.left=(tr.start*100)+'%';clip.style.width=((tr.end-tr.start)*100)+'%';applyClock(clock);if(selected===tr.id)renderInspector();persist();}
    function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);}
  clip.addEventListener('mousedown',e=>{if(e.target.classList.contains('h'))return;drag(e,'move');});
  clip.querySelector('.h.l').addEventListener('mousedown',e=>{e.stopPropagation();drag(e,'l');});
  clip.querySelector('.h.r').addEventListener('mousedown',e=>{e.stopPropagation();drag(e,'r');});}
function select(id){selected=id;renderTimeline();renderInspector();}
function delTrack(id){tracks=tracks.filter(t=>t.id!==id);if(selected===id)selected=null;renderTimeline();renderInspector();applyClock(clock);persist();}
function renderInspector(){
  const insp=$('#insp'),tr=tracks.find(t=>t.id===selected);
  $('#selname').textContent=tr?`${(CONTENT.find(e=>e.id===tr.target)||{}).label||tr.target} · ${tr.property}`:'— no track selected —';
  if(!tr){insp.innerHTML=CONTENT.length?'<span class="muted">Select a content track to retime it, or ＋ add one.</span>':'<span class="muted">No content elements declared for this target (knobs only). Add some via RIG.content.</span>';return;}
  insp.innerHTML=`<div class="grp"><label class="mini muted">Element</label><select id="i-el">${CONTENT.map(e=>`<option value="${e.id}" ${e.id===tr.target?'selected':''}>${e.label}</option>`).join('')}</select></div>
    <div class="grp"><label class="mini muted">Prop</label><select id="i-prop">${CPROP_KEYS.map(p=>`<option ${p===tr.property?'selected':''}>${p}</option>`).join('')}</select></div>
    <div class="sep"></div><div class="grp"><label class="mini muted">from</label><input type="number" id="i-from" value="${tr.from}" step="any"></div>
    <div class="grp"><label class="mini muted">to</label><input type="number" id="i-to" value="${tr.to}" step="any"></div>
    <div class="sep"></div><div class="grp"><label class="mini muted">start</label><input type="number" id="i-start" value="${tr.start.toFixed(2)}" min="0" max="1" step="0.01"></div>
    <div class="grp"><label class="mini muted">end</label><input type="number" id="i-end" value="${tr.end.toFixed(2)}" min="0" max="1" step="0.01"></div>
    <div class="sep"></div><div class="grp"><label class="mini muted">Easing</label><select id="i-ease">${EASE_KEYS.map(k=>`<option ${k===tr.easing?'selected':''}>${k}</option>`).join('')}</select></div>`;
  const bind=(sel,key,num)=>{const el=$(sel);el.oninput=()=>{tr[key]=num?parseFloat(el.value):el.value;renderTimeline();applyClock(clock);persist();};};
  bind('#i-el','target');bind('#i-prop','property');bind('#i-from','from',1);bind('#i-to','to',1);bind('#i-start','start',1);bind('#i-end','end',1);bind('#i-ease','easing');
}
ruler.addEventListener('mousedown',e=>{if(axis==='time')pause();const rr=ruler.getBoundingClientRect();setClock((e.clientX-rr.left)/rr.width);
  const mv=ev=>{const r=ruler.getBoundingClientRect();setClock((ev.clientX-r.left)/r.width);};const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});

//////////////////// PERSISTENCE ////////////////////
const LS_KEY='rig-'+RIG.target;
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify({knob,dur:$('#dur').value,tracks:tracks.map(({target,property,from,to,start,end,easing})=>({target,property,from,to,start,end,easing}))}));}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(!s)return;if(s.knob)Object.assign(knob,s.knob);
  if(Array.isArray(s.tracks))tracks=s.tracks.map(t=>mkTrack(t));if(s.dur)$('#dur').value=s.dur;setKnobDom();}catch(e){}}
window.addEventListener('beforeunload',persist);$('#dur').addEventListener('change',persist);

//////////////////// EXPORT + APPLY ////////////////////
function exportJSON(){return JSON.stringify({target:RIG.target,knob,dur:$('#dur').value,
  tracks:tracks.map(({target,property,from,to,start,end,easing})=>({target,property,from,to,start,end,easing}))},null,2);}
function toast(msg,bg,fg){const t=$('#toast');t.textContent=msg;t.style.background=bg||'#12351f';t.style.color=fg||'#9ff0c4';t.style.borderColor=bg?'transparent':'#2f6b48';t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',4600);}
$('#export').onclick=()=>{ navigator.clipboard?.writeText(exportJSON()); toast('Tune JSON copied to clipboard'); };
$('#apply').onclick=async()=>{ persist();
  const payload={target:RIG.target,knob,dur:$('#dur').value,generatedAt:new Date().toISOString(),
    tracks:tracks.map(({target,property,from,to,start,end,easing})=>({target,property,from,to,start,end,easing}))};
  toast('Applying…','#1a2733','#bcd6ee');
  try{const r=await fetch(RIG.apply.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(j.ok)toast('✓ Wrote '+j.wrote.length+' files — '+j.wrote.join('  ·  '));else toast('✕ '+(j.error||'apply failed'),'#3a1a1a','#f0b0b0');
  }catch(e){toast('✕ No write-back server. Run serve.py and open the bench from its origin.','#3a1a1a','#f0b0b0');}};

//////////////////// WIRING ////////////////////
document.querySelectorAll('#axis button').forEach(b=>b.onclick=()=>setAxis(b.dataset.axis));
$('#play').onclick=()=>playing?pause():play();
$('#add').onclick=()=>{if(!CONTENT.length){toast('No content elements declared (RIG.content is empty).','#3a2a12','#ffd08a');return;}const tr=mkTrack({start:clock,end:Math.min(1,clock+0.2)});tracks.push(tr);select(tr.id);applyClock(clock);persist();};
$('#reset').onclick=()=>{RIG.knobs.forEach(k=>knob[k.key]=k.def);setKnobDom();tracks=[];selected=null;if(RIG.preview.build)RIG.preview.build();runValidity();renderTimeline();renderInspector();setClock(0);persist();};
$('#scrub0').onclick=()=>{pause();setClock(0);};$('#scrubm').onclick=()=>{pause();setClock(0.5);};$('#scrub1').onclick=()=>{pause();setClock(1);};
proxy.addEventListener('scroll',()=>{if(axis==='scroll')onProxyScroll();});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&axis==='time'){e.preventDefault();playing?pause():play();}});
$('#maxprev').onclick=()=>{const on=document.body.classList.toggle('previewmax');$('#maxprev').textContent=on?'✕ Exit preview':'⛶ Preview';applyClock(clock);};
// Quit — stop the write-back server from the UI (two-click confirm; no blocking dialog)
let _quitArmed=false;
$('#shutdown').onclick=async()=>{
  if(!_quitArmed){_quitArmed=true;$('#shutdown').textContent='Click to confirm';setTimeout(()=>{_quitArmed=false;$('#shutdown').textContent='Quit';},3000);return;}
  try{await fetch('/shutdown',{method:'POST'});}catch(e){}
  document.body.innerHTML='<div style="position:fixed;inset:0;display:grid;place-items:center;background:#0e0f13;color:#9ff0c4;font:600 16px/1.6 system-ui;text-align:center">✓ Rig server stopped — you can close this tab.</div>';
};
window.addEventListener('keydown',e=>{if(e.code==='Escape'&&document.body.classList.contains('previewmax')){document.body.classList.remove('previewmax');$('#maxprev').textContent='⛶ Preview';applyClock(clock);}});
// in maximized preview the page can't scroll — so scroll = scrub the clock, EASED toward the wheel
// target each frame (Lenis-like) so it isn't choppy. A real scroll-driven target gets this smoothing
// for free from ScrollTrigger scrub + Lenis; this mirrors that feel in the bench.
let _scrubTarget=null;
window.addEventListener('wheel',e=>{if(!document.body.classList.contains('previewmax'))return;e.preventDefault();if(playing)pause();_scrubTarget=clamp((_scrubTarget==null?clock:_scrubTarget)+e.deltaY*0.0007);},{passive:false});
(function scrubEase(){ if(_scrubTarget!=null){ const d=_scrubTarget-clock; if(Math.abs(d)<0.0006){setClock(_scrubTarget);_scrubTarget=null;} else setClock(clock+d*0.18); } requestAnimationFrame(scrubEase); })();
window.addEventListener('resize',()=>applyClock(clock));

//////////////////// PREVIEW SETUP (iframe or inline) ////////////////////
if(RIG.preview.mode==='iframe'){
  const st=$('#stage');
  /* SAME-HOST GATE -- see FAILURE_LOG 2026-08-07. Chrome treats `localhost` and `127.0.0.1` as
     different SITES and throttles rAF inside a cross-site iframe, so the target silently freezes at
     frame one while synchronous calls still work -- it reads as a broken component. Ports are NOT
     part of a site, so localhost:8792 framing localhost:3117 is fine; mixing the two HOSTNAMES is
     what breaks. This is a gate rather than a comment on purpose: the prose version was already in
     the skill and got violated anyway (*gate enforced in the writer*). */
  let u=null; try{ u=new URL(RIG.preview.url, location.href); }catch(e){}
  if(u && u.hostname && u.hostname!==location.hostname){
    st.innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;padding:32px;'
      +'background:#2a1010;color:#ffd0c8;font:13px/1.7 ui-monospace,monospace;text-align:center">'
      +'<div style="max-width:56ch"><b style="font-size:15px">Bench and target must share a hostname.</b><br><br>'
      +'bench = <b>'+location.hostname+'</b> &nbsp;/&nbsp; target = <b>'+u.hostname+'</b><br><br>'
      +'Chrome treats these as different <i>sites</i> and throttles rAF in the iframe. The preview '
      +'would freeze at frame one while still looking correctly composed -- the most convincing '
      +'wrong evidence there is.<br><br>Reopen this bench at<br><b>http://'+u.hostname+':'+location.port+'/rig-bench.html</b>'
      +'</div></div>';
    console.error('[rig] same-host gate: bench host "'+location.hostname+'" cannot frame "'+u.hostname+'" without rAF throttling.');
  } else {
    st.innerHTML='<iframe src="'+RIG.preview.url+'"></iframe>';
  }
}
else if(RIG.preview.build){ RIG.preview.build(); }

//////////////////// BOOT ////////////////////
loadState(); runValidity(); renderTimeline(); renderInspector(); setAxis('time'); setClock(0);
</script>
</body>
</html>
